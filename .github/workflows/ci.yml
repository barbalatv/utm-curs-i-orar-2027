name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The workflow only reads the repository; the token needs no write scope.
permissions:
  contents: read

jobs:
  verify:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Matches the production runtime in the Dockerfile (node:22-bookworm-slim),
          # so CI fails on anything that would fail in the deployed image.
          node-version: "22"
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      # The Workers and the MD Publisher are separate TypeScript projects with their own
      # compiler settings. Without these steps they can only break at deploy time.
      - run: npm run typecheck:worker

      - run: npm run typecheck:worker-egress

      - run: npm run typecheck:publisher

      # Bundle and validate both Worker entrypoints/configs locally. Dry runs require no
      # Cloudflare credentials and do not deploy or mutate remote resources.
      - run: npm run check:worker

      - run: npm run check:worker-egress

      - run: npm run build:publisher

      - run: npm run lint

      # Parser, updater and API smoke suites. They read bundled PDF fixtures and stub
      # every outbound fetch, so no network access or secrets are required.
      - run: npm test

      # All routes are dynamic, so the build never runs instrumentation and needs no
      # environment variables. Keep it that way: a build that needs secrets cannot be
      # verified on a fork's pull request.
      - run: npm run build

      - run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failure-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
