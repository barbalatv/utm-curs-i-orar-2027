// Week parity: the first week of September (starting Monday 31.08.2026) is odd
const SEM_START=new Date(2026,7,31), SEM_END=new Date(2026,11,20,23,59);
const WEEK_NOTES={7:'Evaluarea periodică',8:'Evaluarea periodică'};
function currentWeek(){
  const now=new Date(); if(now<SEM_START||now>SEM_END)return null;
  const mon=new Date(now); mon.setHours(0,0,0,0); mon.setDate(mon.getDate()-((mon.getDay()+6)%7));
  const n=Math.round((mon-SEM_START)/(7*864e5))+1;
  const sun=new Date(mon); sun.setDate(sun.getDate()+6);
  return {n,par:n%2===1?1:2,mon,sun};
}
function renderWeeks(){
  const cw=currentWeek();
  const opts=['Toate','Impară','Pară'];
  $('weeks').innerHTML=opts.map((o,i)=>`<button class="chip${cw&&cw.par===i?' now':''}" aria-pressed="${i===state.week}" data-w="${i}">${o}${cw&&cw.par===i?'<span class="nowdot" title="Săptămâna curentă"></span>':''}</button>`).join('');
  $('weeks').querySelectorAll('button').forEach(b=>b.onclick=()=>{state.week=+b.dataset.w;render()});
  const f=d=>d.getDate()+'.'+String(d.getMonth()+1).padStart(2,'0');
  $('curweek').innerHTML=cw?`Acum este <b>săptămâna ${cw.n}</b>, <span class="curpar">${cw.par===1?'impară':'pară'}</span> <span class="curdates">(${f(cw.mon)}–${f(cw.sun)})</span>${WEEK_NOTES[cw.n]?` <span class="curnote">${WEEK_NOTES[cw.n]}</span>`:''}`:'În afara perioadei de cursuri';
}

const tq=$('tq'),tl=$('tlist');let tAct=0,tItems=[];
const fold=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
function showList(){
  const q=fold(tq.value.trim());
  tItems=D.teachers.filter(t=>!q||fold(t).includes(q)||fold(dn(t)).includes(q)).sort((a,b)=>dn(a).localeCompare(dn(b),'ro')).slice(0,60);

tq.addEventListener('focus',showList);tq.addEventListener('input',showList);

  if(e.key==='Enter'){e.preventDefault();pick(bs[tAct].dataset.t)}

function items(){
  let list;
  if(state.mode==='group') list=recs.filter(r=>r.g===state.group);
  else{
    const raw=recs.filter(r=>r.t.includes(state.teacher));
    const m=new Map();
    raw.forEach(r=>{const k=[r.d,r.s,r.w,fold(r.subj).replace(/\s+/g,''),r.room].join('|');if(!m.has(k))m.set(k,{...r,groups:[]});const e=m.get(k);if(!e.groups.includes(r.g))e.groups.push(r.g)});
    list=[...m.values()];
  }
  return list;
}
function visible(r){return state.week===0||r.w===0||r.w===state.week}
function clashes(list){
  const bad=new Set();
  if(state.mode!=='teacher')return bad;
  for(let i=0;i<list.length;i++)for(let j=i+1;j<list.length;j++){
    const a=list[i],b=list[j];
    if(a.d===b.d&&a.s===b.s&&(a.w===0||b.w===0||a.w===b.w)&&a.room&&b.room&&a.room!==b.room){bad.add(a);bad.add(b)}
  }
  return bad;
}
function evHTML(r,bad){
  const who=state.mode==='group'?r.t.map(tname).join(', '):r.groups.join(', ');
  const wk=r.w?`<span class="wk" title="Doar în săptămâna ${WK[r.w]}">săpt. ${WK[r.w]}</span>`:'';
  const dim=!visible(r)?' dim':'';
  return `<div class="ev ${r.k}${bad.has(r)?' clash':''}${dim}" title="${esc(KIND[r.k]||'')}">${wk}<div class="s">${esc(r.subj)}</div>${who?`<div class="m">${esc(who)}</div>`:''}${r.room?`<div class="m">${/^aula/i.test(r.room)?'':'sala '}${esc(r.room)}</div>`:''}</div>`;
}
function cellHTML(list,d,s,bad){
  const here=list.filter(r=>r.d===d&&r.s===s).sort((a,b)=>a.w-b.w);
  if(state.week!==0) return `<div class="cell">${here.filter(visible).map(r=>evHTML(r,bad)).join('')}</div>`;
  // "Toate": mirror the Excel layout - odd week on top, even week below
  if(!here.some(r=>r.w))return `<div class="cell">${here.map(r=>evHTML(r,bad)).join('')}</div>`;
  const wk=here.filter(r=>!r.w),odd=here.filter(r=>r.w===1),even=here.filter(r=>r.w===2);
  const half=(items,label)=>items.length?items.map(r=>evHTML(r,bad)).join(''):`<div class="freehalf">săpt. ${label}: liber</div>`;
  return `<div class="cell split">${wk.map(r=>evHTML(r,bad)).join('')}<div class="half">${half(odd,'impară')}</div><div class="half">${half(even,'pară')}</div></div>`;
}
function render(){
  renderExcel();
  $('mGroup').setAttribute('aria-pressed',state.mode==='group');$('mTeacher').setAttribute('aria-pressed',state.mode==='teacher');
  $('ctlGroup').hidden=state.mode!=='group';$('ctlTeacher').hidden=state.mode!=='teacher';

  if(!list.length){out.innerHTML=html+'<div class="empty">Nu am găsit activități pentru această selecție.</div>';return}
  html+='<div class="gridwrap"><table class="grid"><thead><tr><th>Ora</th>'+D.days.map((d,i)=>`<th class="${i===todayIdx?'today':''}">${d}</th>`).join('')+'</tr></thead><tbody>';
  D.times.forEach((t,s)=>{const [a,b]=t.split('-');html+=`<tr><td class="time"><b>${a}</b>${b}</td>`+D.days.map((_,d)=>`<td class="${d===todayIdx?'todaycol':''}">${cellHTML(list,d,s,bad)}</td>`).join('')+'</tr>'});
  html+='</tbody></table></div>';
  html+='<div class="days"><div class="daytabs" role="group" aria-label="Ziua">'+D.days.map((d,i)=>`<button class="${i===todayIdx?'istoday':''}" aria-pressed="${i===state.day}" data-d="${i}">${d.slice(0,3)}${i===todayIdx?'<span class="nowdot"></span>':''}</button>`).join('')+'</div>';
  let any=false;
  D.times.forEach((t,s)=>{const c=list.filter(r=>r.d===state.day&&r.s===s&&(state.week===0||visible(r)));if(!c.length)return;any=true;const [a,b]=t.split('-');html+=`<div class="slot"><div class="t"><b>${a}</b>${b}</div>${cellHTML(list,state.day,s,bad)}</div>`});
  if(!any)html+='<div class="empty">Nicio activitate în această zi.</div>';
  html+='</div>';
  out.innerHTML=html;
  out.querySelectorAll('.daytabs button').forEach(b=>b.onclick=()=>{state.day=+b.dataset.d;render()});
}

const XL=(typeof window!=='undefined'&&window.ORAR_FCIM_EXCEL)||{};
const XLICON='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/><path d="M12 12v6M9 15l3 3 3-3"/></svg>';
function renderExcel(){
  const links=D.years.map(y=>({y,url:(XL['Anul '+y.y]||'').trim()})).filter(x=>x.url);
  $('xl').hidden=!links.length;
  const fmt=u=>/\.pdf(\?|#|$)/i.test(u)?'PDF':(/\.xlsx?(\?|#|$)/i.test(u)?'Excel':'fișier');
  const fs=[...new Set(links.map(l=>fmt(l.url)))];
  $('xlh').textContent=fs.length===1&&fs[0]!=='fișier'?'Orarul complet în format '+fs[0]:'Orarul complet';
  $('xlbtns').innerHTML=links.map(({y,url})=>`<a href="${esc(url)}" ${fmt(url)==='PDF'?'':'download'} target="_blank" rel="noopener" class="${state.mode==='group'&&state.year===y.y?'cur':''}">${XLICON}Anul ${y.y} <small>sem. ${y.sem} · ${fmt(url)}</small></a>`).join('');
}
$('mGroup').onclick=()=>{state.mode='group';render()};
$('mTeacher').onclick=()=>{state.mode='teacher';render();if(!state.teacher)tq.focus()};
render();

})();
</script>
